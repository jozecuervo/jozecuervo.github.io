<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en-US' }}">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <meta property="og:title" content="{{ page.title | default: site.title }}">
    <meta property="og:description" content="{{ page.description | default: site.description }}">
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta property="og:site_name" content="{{ site.title }}">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
  </head>
  <body class="{{ page.page_class | default: 'site-page' }}">
    <a class="skip-link" href="#content">Skip to content</a>
    <div class="site-chrome"></div>
    <header class="site-header">
      <a class="site-mark" href="{{ '/' | relative_url }}">JMH</a>
      <nav class="site-nav" aria-label="Primary">
        <a href="{{ '/' | relative_url }}">Home</a>
        <a href="{{ '/family-tbi-guide.html' | relative_url }}">Guide</a>
        <a href="https://github.com/jozecuervo" target="_blank" rel="noreferrer">GitHub</a>
        <a href="mailto:me@jose.io">Email</a>
      </nav>
    </header>
    <main id="content" class="site-main">
      {% if page.page_class == 'home-page' %}
      {{ content }}
      {% else %}
      <article class="article-shell">
        <div class="article-frame">
          <p class="eyebrow">Resource</p>
          <h1>{{ page.title }}</h1>
          {% if page.description %}
          <p class="page-intro">{{ page.description }}</p>
          {% endif %}
        </div>
        <div class="article-body">
          {{ content }}
        </div>
      </article>
      {% endif %}
    </main>
    <footer class="site-footer">
      <p>Built in GitHub Pages. Managed as source, not as a pasted profile.</p>
    </footer>
  </body>
</html>
